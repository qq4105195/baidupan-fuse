[package]
name = "baidupan-fuse"
version = "0.1.0"
edition = "2021"
description = "百度网盘 FUSE 挂载(只读)——Linux/macOS"
license = "MIT"

# 二进制名用短名 bdfs:裸跑进交互控制台,子命令供脚本用
[[bin]]
name = "bdfs"
path = "src/main.rs"

# FUSE 用户态文件系统(Linux/macOS;Windows 不用 FUSE,走 Cloud Files API 见 src/win/)
# Linux:关掉默认的 libfuse feature,走纯 Rust 挂载实现(不依赖系统 libfuse)
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false, features = ["abi-7-28"] }

# macOS:libfuse feature 会通过 pkg-config 找 macFUSE/FUSE-T,保持默认
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
fuser = "0.15"

# Unix 专用:errno 常量、信号/umount(菜单卸载、fs 错误映射)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 专用:Cloud Files API 绑定(OneDrive 式按需文件夹)+ 优雅退出 + 命名互斥/事件
# + 托盘图标(内部 re-export muda 菜单)。Storage::FileSystem 给 syncback 的
# ReadDirectoryChangesW(本地新建/改名/删除没有 cldapi 回调);Console 是 tray 的
# FreeConsole;WindowsAndMessaging 是托盘的消息泵 + 设置窗口;
# Gdi/Shell/Com/LibraryLoader 是设置窗口的字体底色 / 目录选择(SHBrowseForFolder
# 还要 Shell_Common 拿 ITEMIDLIST)/ pidl 释放 / 实例句柄;KeyboardAndMouse 是 SetFocus
[target.'cfg(windows)'.dependencies]
cloud-filter = "0.0.6"
ctrlc = "3"
tray-icon = "0.25"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }

[dependencies]
# HTTP 客户端,blocking 模式(fuser 的 Filesystem 是同步 trait,不需要 tokio)
# rustls 避免交叉编译时链 openssl;multipart 给上传分片用(superfile2)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

# cloud-filter 0.0.6 打了两个本地补丁(失败应答 Buffer 置空、回调失败不 unwrap 杀进程),
# 见 vendor/cloud-filter/PATCHES.md;上游修了再撤
[patch.crates-io]
cloud-filter = { path = "vendor/cloud-filter" }
